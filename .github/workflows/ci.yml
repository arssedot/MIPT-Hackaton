name: CI
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true
jobs:
  quality:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:17-bookworm
        env:
          POSTGRES_USER: procurement
          POSTGRES_DB: procurement
          POSTGRES_PASSWORD: ci-only-disposable-password
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U procurement -d procurement"
          --health-interval 5s --health-timeout 5s --health-retries 15
    env:
      DATABASE_URL: postgresql://procurement:ci-only-disposable-password@localhost:5432/procurement?schema=public
      NEXT_TELEMETRY_DISABLED: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm audit --audit-level=high
      - run: npm run setup
      - run: npm run check
      - run: npm run db:migrate
      - run: npm run build
      - run: npx playwright install --with-deps chromium
      - run: npm run test:e2e
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7
  docker:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
      - run: npm run setup
      - run: docker compose up --build -d --wait --wait-timeout 240
      - name: Readiness and restart persistence
        run: |
          curl --fail http://localhost:3000/api/health/ready
          docker compose restart app
          for attempt in $(seq 1 30); do
            if curl --fail --silent http://localhost:3000/api/health/ready; then break; fi
            sleep 2
          done
          curl --fail http://localhost:3000/api/health/ready
      - name: Database outage
        run: |
          docker compose stop db
          test "$(curl --silent --output /dev/null --write-out '%{http_code}' http://localhost:3000/api/health/ready)" = 503
          curl --fail http://localhost:3000/api/health/live
      - name: Diagnostics
        if: failure()
        run: docker compose logs --tail=80 app init db
      - name: Cleanup
        if: always()
        run: docker compose down --volumes
